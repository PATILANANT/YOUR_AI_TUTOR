<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Your AI Tutor</title>
  <meta name="description" content="Sign in or create an account to access your personalized AI tutor." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .auth-grid {
      background-image:
        radial-gradient(circle at 20% 50%, rgba(99,102,241,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139,92,246,0.06) 0%, transparent 40%),
        linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
    }
    .tab-active {
      background: var(--indigo-600);
      color: white;
      box-shadow: 0 2px 12px rgba(79,70,229,0.35);
    }
    .tab-inactive {
      color: #71717a;
    }
    .tab-inactive:hover { color: #a1a1aa; }
    .strength-bar { height:3px; border-radius:999px; transition: all 0.3s; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .input { padding-left: 2.75rem; }
    .input-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: #52525b;
      pointer-events: none;
    }
  </style>
</head>
<body class="auth-grid min-h-screen flex items-center justify-center px-4 py-12" style="background:#09090b; color:#f4f4f5; font-family:'Inter',sans-serif;">

  <!-- Back to home -->
  <a href="index.html" class="fixed top-5 left-5 flex items-center gap-2 text-sm transition-colors"
     style="color:#71717a;" onmouseover="this.style.color='#f4f4f5'" onmouseout="this.style.color='#71717a'">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
    </svg>
    Back to Home
  </a>

  <div class="w-full max-w-md relative z-10 animate-scale-in">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2.5 mb-5">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold shadow-lg shadow-indigo-600/30">AI</div>
        <span class="text-lg font-semibold tracking-tight">Your AI Tutor</span>
      </a>
      <div>
        <h1 class="text-2xl font-bold tracking-tight" id="form-title">Welcome back</h1>
        <p class="text-sm mt-1" id="form-subtitle" style="color:#71717a;">Sign in to continue your learning journey</p>
      </div>
    </div>

    <!-- Card -->
    <div class="glass-strong rounded-2xl p-1 mb-4">
      <!-- Tab Switcher -->
      <div class="grid grid-cols-2 gap-1 p-1 rounded-xl mb-1" style="background:rgba(0,0,0,0.3);">
        <button id="tab-login" onclick="setMode(true)"
          class="tab-active py-2 text-sm font-semibold rounded-lg transition-all">
          Sign In
        </button>
        <button id="tab-register" onclick="setMode(false)"
          class="tab-inactive py-2 text-sm font-semibold rounded-lg transition-all">
          Create Account
        </button>
      </div>
    </div>

    <div class="glass-strong rounded-2xl p-7">
      <form id="auth-form" class="space-y-4">

        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium mb-1.5" style="color:#d4d4d8;">Username</label>
          <div class="input-icon-wrap">
            <svg class="input-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input id="username" type="text" required autocomplete="username"
              class="input select"
              placeholder="Enter your username" />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium mb-1.5" style="color:#d4d4d8;">Password</label>
          <div class="input-icon-wrap" style="position:relative;">
            <svg class="input-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input id="password" type="password" required autocomplete="current-password"
              class="input"
              style="padding-left:2.75rem; padding-right:2.75rem;"
              placeholder="Enter your password"
              oninput="checkPasswordStrength(this.value)" />
            <!-- Show/Hide Password -->
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 transition-colors" style="color:#52525b;" id="pw-toggle">
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>

          <!-- Password strength bar (only on register) -->
          <div id="pw-strength" class="hidden mt-2">
            <div class="flex gap-1.5 mb-1">
              <div id="str-1" class="strength-bar flex-1" style="background:rgba(255,255,255,0.08);"></div>
              <div id="str-2" class="strength-bar flex-1" style="background:rgba(255,255,255,0.08);"></div>
              <div id="str-3" class="strength-bar flex-1" style="background:rgba(255,255,255,0.08);"></div>
              <div id="str-4" class="strength-bar flex-1" style="background:rgba(255,255,255,0.08);"></div>
            </div>
            <p id="str-label" class="text-[11px]" style="color:#71717a;">Enter a password</p>
          </div>
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
          class="btn btn-primary w-full mt-2" style="padding:0.75rem;">
          <svg id="btn-spinner" class="hidden animate-spin w-4 h-4" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.07);"></div>
        <span class="text-xs" style="color:#52525b;">or</span>
        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.07);"></div>
      </div>

      <p class="text-sm text-center" style="color:#71717a;">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-mode" class="ml-1.5 font-semibold transition-colors"
                style="color:#818cf8;"
                onmouseover="this.style.color='#a5b4fc'"
                onmouseout="this.style.color='#818cf8'">
          Create Account
        </button>
      </p>
    </div>

    <!-- Trust indicators -->
    <div class="flex items-center justify-center gap-5 mt-6 text-xs" style="color:#52525b;">
      <span class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        Secure
      </span>
      <span class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Free to Use
      </span>
      <span class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        AI Powered
      </span>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let isLogin = true;
    const pwInput = document.getElementById('password');

    function setMode(loginMode) {
      isLogin = loginMode;
      document.getElementById('tab-login').className = loginMode
        ? 'tab-active py-2 text-sm font-semibold rounded-lg transition-all'
        : 'tab-inactive py-2 text-sm font-semibold rounded-lg transition-all';
      document.getElementById('tab-register').className = loginMode
        ? 'tab-inactive py-2 text-sm font-semibold rounded-lg transition-all'
        : 'tab-active py-2 text-sm font-semibold rounded-lg transition-all';

      document.getElementById('btn-text').textContent = loginMode ? 'Sign In' : 'Create Account';
      document.getElementById('toggle-mode').textContent = loginMode ? 'Create Account' : 'Sign In';
      document.getElementById('toggle-text').textContent = loginMode ? "Don't have an account?" : 'Already have an account?';
      document.getElementById('form-title').textContent = loginMode ? 'Welcome back' : 'Get started';
      document.getElementById('form-subtitle').textContent = loginMode ? 'Sign in to continue your learning journey' : 'Create your free account to begin';
      document.getElementById('pw-strength').classList.toggle('hidden', loginMode);
      if (loginMode) pwInput.autocomplete = 'current-password';
      else pwInput.autocomplete = 'new-password';
    }

    document.getElementById('toggle-mode').addEventListener('click', () => setMode(!isLogin));

    function togglePassword() {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      document.getElementById('eye-icon').innerHTML = show
        ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`
        : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
    }

    function checkPasswordStrength(val) {
      const bars = [1,2,3,4].map(n => document.getElementById(`str-${n}`));
      const label = document.getElementById('str-label');
      const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
      const labels = ['Weak','Fair','Good','Strong'];
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      bars.forEach((b, i) => {
        b.style.background = i < score ? colors[Math.max(0, score-1)] : 'rgba(255,255,255,0.08)';
      });
      label.textContent = val.length ? labels[Math.max(0, score-1)] : 'Enter a password';
      label.style.color = val.length ? colors[Math.max(0, score-1)] : '#71717a';
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) { showToast('Please fill in all fields', 'warning'); return; }

      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');
      spinner.classList.remove('hidden');
      btnText.textContent = isLogin ? 'Signing in…' : 'Creating account…';

      try {
        if (!isLogin) {
          await apiCall('/register', 'POST', { username, password });
          showToast('Account created! Signing you in…', 'success');
        }
        const res = await apiCall('/login', 'POST', { username, password });
        setUser({ user_id: res.user_id, username });
        const profileRes = await apiCall(`/load_profile/${res.user_id}`);
        setProfile(profileRes.profile);
        showToast(`Welcome, ${username}! 🎉`, 'success');
        setTimeout(() => window.location.href = 'index.html', 700);
      } catch (err) {
        showToast(err.message, 'error');
        btnText.textContent = isLogin ? 'Sign In' : 'Create Account';
      } finally {
        spinner.classList.add('hidden');
      }
    });

    if (getUser()) window.location.href = 'index.html';
  </script>
</body>
</html>
